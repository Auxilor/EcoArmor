# The ID of the tier is the name of the .yml file,
# for example diamond.yml has the ID of diamond
# You can place tiers anywhere in this folder,
# including in subfolders if you want to organize your tier configs
# _example.yml is not loaded.

display: "&c&lNETHERITE" # The display in-game
requiresTiers: # If this tier requires a prior tier
  - diamond # Tier ID
  - iron
additive: false # If true, applying this tier's crystal ADDS its modifiers on top of the item's current modifiers instead of replacing them. Also allows the same tier to be stacked multiple times.
stack-limit: -1 # Only used when additive is true. Max number of times this tier can be stacked onto one item. -1 = unlimited.
crystal:
  item: end_crystal # The crystal item, read more here: https://hub.auxilor.io/wiki/eco/the-item-lookup-system-the-item-lookup-system
  name: "&cNetherite Upgrade Crystal" # The name shown in-game.
  lore: # The lore shown in-game. Set to `lore: []` to remove lore.
    - "&8Drop this onto an armor piece"
    - "&8to set its tier to:"
    - "&c&lNETHERITE"
    - ''
    - "&8&oRequires the armor to already have Diamond tier"
  craftable: true # If the armor piece is craftable
  crafting-permission: "permission" # (Optional) The permission required to craft this recipe.
  shapeless: false # (Optional) If true, the recipe will be shapeless. Default false.
  recipe: # The recipe, read here for more: https://hub.auxilor.io/wiki/eco/the-item-lookup-system-the-item-lookup-system#crafting-recipes
    - air
    - netherite_ingot
    - air
    - netherite_ingot
    - ecoarmor:upgrade_crystal_diamond
    - netherite_ingot
    - air
    - netherite_ingot
    - air
  giveAmount: 1 # Optional, set the amount of items to give in the recipe
properties:
  # Each piece takes vanilla attribute modifiers under components. Only attribute_modifiers can be set on a tier.
  # operation is add_value, add_multiplied_base or add_multiplied_total, and defaults to add_value.
  # slot defaults to the piece's own slot. The old stat options (armor, toughness, speedPercentage and the rest) are deprecated.
  helmet:
    components:
      attribute_modifiers:
        - type: "minecraft:armor"
          amount: 3
          operation: "add_value"
        - type: "minecraft:armor_toughness"
          amount: 3
          operation: "add_value"
        - type: "minecraft:knockback_resistance"
          amount: 0.01
          operation: "add_value"
        - type: "minecraft:water_movement_efficiency"
          amount: 0.35
          operation: "add_value"
  chestplate:
    components:
      attribute_modifiers:
        - type: "minecraft:armor"
          amount: 8
          operation: "add_value"
        - type: "minecraft:armor_toughness"
          amount: 3
          operation: "add_value"
        - type: "minecraft:knockback_resistance"
          amount: 0.01
          operation: "add_value"
  elytra:
    components:
      attribute_modifiers:
        - type: "minecraft:armor"
          amount: 3
          operation: "add_value"
        - type: "minecraft:knockback_resistance"
          amount: 0.01
          operation: "add_value"
  leggings:
    components:
      attribute_modifiers:
        - type: "minecraft:armor"
          amount: 6
          operation: "add_value"
        - type: "minecraft:armor_toughness"
          amount: 3
          operation: "add_value"
        - type: "minecraft:knockback_resistance"
          amount: 0.01
          operation: "add_value"
  boots:
    components:
      attribute_modifiers:
        - type: "minecraft:armor"
          amount: 3
          operation: "add_value"
        - type: "minecraft:armor_toughness"
          amount: 3
          operation: "add_value"
        - type: "minecraft:knockback_resistance"
          amount: 0.01
          operation: "add_value"
